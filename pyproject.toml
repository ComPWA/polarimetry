[project]
name = "polarimetry-lc2pkpi"
description = "Symbolic expressions that describe an aligned polarimeter vector field"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Mikhail Mikhasenko" },
    { name = "Remco de Boer" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "IPython",
    "PyYAML",
    "ampform>=0.15.11",  # @unevaluated decorator, cached module, single-sqrt phsp factor
    "ampform-dpd~=0.4.0",  # cached module, DefinedExpression
    "attrs>=20.1.0",
    "cairosvg",
    "matplotlib",
    "numpy",
    "scour",
    "sympy>=1.10",
    "tensorwaves[jax]>=0.4.5",
]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[dependency-groups]
dev = [
    "nbmake",
    "ruff",
    "sphinx-autobuild",
    "ty",
    { include-group = "doc" },
    { include-group = "jupyter" },
    { include-group = "style" },
    { include-group = "test" },
]
doc = [
    "myst-nb",
    "sphinx-api-relink",
    "sphinx-book-theme",
    "sphinx-codeautolink[ipython]",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-pybtex-etal-style",
    "sphinx-reredirects",
    "sphinx-togglebutton",
    "sphinxcontrib-bibtex>=2.2",
    "sphinxcontrib-svg2pdfconverter",
]
jupyter = [
    "jupyter-ruff",
    "jupyterlab",
    "jupyterlab-execute-time",
    "jupyterlab-git",
    "jupyterlab-lsp",
    "jupyterlab-myst",
    "jupyterlab-quickopen",
    "python-lsp-ruff",
    "python-lsp-server",
    { include-group = "notebooks" },
]
notebooks = [
    "cloudpickle",
    "deepdiff",
    "ipympl",
    "ipywidgets",
    "kaleido",
    "kaleido~=0.1,!=0.2.1.post1",
    "matplotlib-inline",
    "pandas",
    "plotly~=5.0",  # https://github.com/executablebooks/MyST-NB/issues/667
    "psutil",
    "scipy",
    "svgutils",
    "tqdm",
    "unicodeitplus",
    "uproot",
]
style = [
    { include-group = "notebooks" },
    { include-group = "types" },
]
test = ["pytest"]
types = [
    "pytest",
    "sphinx-api-relink",
    "types-PyYAML",
    "types-requests",
]

[build-system]
requires = [
    "setuptools>=61.2",
    "setuptools_scm",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.compwa.policy]
package-manager = "pixi+uv"
pytest-single-threaded = true
repo-name = "polarimetry"

[tool.compwa.policy.format]
no-cspell-update = true

[tool.compwa.policy.github]
dependabot-assignees = ["redeboer"]
no-github-actions = true

[tool.compwa.policy.python]
type-checker = ["ty"]

[tool.docstrfmt]
docstring-trailing-line = false
format-python-code-blocks = false

[tool.lychee]
cache = true
cache_exclude_status = "400.."
# [:] keeps Lychee from extracting regex patterns as URLs.
exclude = [
    '^https[:]//journals\.aps\.org/prd/abstract/10\.1103/PhysRevD\.101\.034033$',  # APS rejects automated requests from GitHub Actions
    '^https[:]//journals\.aps\.org/prd/pdf/10\.1103/PhysRevD\.101\.034033#page=(?:9|10|11)$',  # APS rejects automated requests from GitHub Actions
    '^https[:]//cds\.cern\.ch/record/2824328/files$',  # CERN Document Server presents a browser challenge
    '^https[:]//twiki\.cern\.ch/twiki/bin/viewauth/LHCbPhysics/PolarimetryLc2pKpi$',  # Requires CERN authentication
    "%7B[^/]*%7D",  # URL templates are completed at build or runtime
    "^https[:]//x-access-token/$",  # Token-authenticated Git remote placeholder
    '\$(?:NEXT_[A-Z_]+|PREVIOUS_TAG)',  # Release Drafter substitutes these placeholders at runtime
    '^https[:]//github\.com/ComPWA/polarimetry/pull/\$$',  # The workflow supplies the pull request number at runtime
    '^https[:]//github\.com/(?:user-attachments/assets|[^/]+/[^/]+/assets)/',  # Asset links redirect to expiring signed downloads
    '^https[:]//tex\.stackexchange\.com/a/570691$',  # Rejects automated requests with 403
    '^https[:]//doi\.org/10\.1007/JHEP07\(2023\)228$',  # Publisher redirects automated requests through a cookie challenge
    '^https[:]//indico\.cern\.ch/event/1213570$',  # Requires authentication
    '^https[:]//stackoverflow\.com/a/44727682$',  # Rejects automated requests with 403
    '^https[:]//gist\.github\.com/taxus-d/aa69e43c3d8b804864ede4a8c056e9cd$',  # The historical covariance notebook gist is no longer available
]
exclude_path = ["tests"]  # Test fixtures contain dummy URLs
extensions = ["bib", "css", "ipynb", "json", "md", "py", "toml", "yaml", "yml"]
hidden = true  # Include the workflows under .github/
include_fragments = "anchor-only"
include_verbatim = true
max_cache_age = "7d"
remap = [
    '^https[:]//compwa\.github\.io/report/017/n$ https://compwa.github.io/report/017/',
    '^git\+(https[:]//[^@]+)(@.*)?$ $1',
    "^(.+)/n$ $1",
    '^(https[:]//github\.com/ComPWA/polarimetry/compare)/\$PREVIOUS_TAG.*$ $1',
    '^https[:]//pypi\.org/p/\$$ https://pypi.org/project/polarimetry-lc2pkpi/',
    '^https[:]//repo\.prefix\.dev/julia-forge$ https://prefix.dev/channels/julia-forge',  # The channel endpoint serves package metadata, not a web page
    '^https[:]//github\.com/ComPWA/polarimetry/issues/5#issue-1220525993$ https://github.com/ComPWA/polarimetry/issues/5',  # GitHub renders comment anchors dynamically
    '^https[:]//github\.com/ComPWA/polarimetry/pull/11#issuecomment-1128784376$ https://github.com/ComPWA/polarimetry/pull/11',  # GitHub renders comment anchors dynamically
]

[tool.pytest]
addopts = [
    "--color=yes",
    "--doctest-continue-on-failure",
    "--doctest-modules",
    "--durations=3",
    "--ignore-glob=.virtual_documents",
    "--ignore=docs/appendix/widget.ipynb",
    "--ignore=docs/conf.py",
    "--import-mode=importlib",
    "-m not slow",
]
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore:The collections attribute was deprecated.*:matplotlib._api.deprecation.MatplotlibDeprecationWarning",
    "ignore:the imp module is deprecated in favour of importlib.*:DeprecationWarning",
]
markers = ["slow: marks tests as slow (select with '-m slow')"]
minversion = "9.0"
norecursedirs = [
    ".ipynb_checkpoints",
    "_build",
]
testpaths = ["src", "tests"]

[tool.ruff]
extend-exclude = ["typings"]
extend-include = ["*.ipynb"]
preview = true
show-fixes = true
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = [
    "ANN",
    "DOC",
    "FBT",
    "PTH",
    "ambiguous-unicode-character-string",
    "any-type",
    "explicit-string-concatenation",
    "if-else-block-instead-of-if-exp",
    "incorrect-blank-line-before-class",
    "line-too-long",
    "logging-f-string",
    "magic-value-comparison",
    "missing-copyright-notice",
    "missing-dashed-underline-after-section",
    "missing-section-name-colon",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "non-ascii-import-name",
    "non-ascii-name",
    "non-empty-init-module",
    "pytest-fixture-incorrect-parentheses-style",
    "read-whole-file",
    "redefined-loop-name",
    "reimplemented-starmap",
    "single-line-implicit-string-concatenation",
    "suspicious-pickle-import",
    "too-many-arguments",
    "undocumented-magic-method",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-init",
    "undocumented-public-method",
    "unspecified-encoding",
    "write-whole-file",
]
select = ["ALL"]
task-tags = ["cspell"]

[tool.ruff.lint.flake8-builtins]
allowed-modules = ["io"]
ignorelist = ["display"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["polarimetry"]
known-third-party = ["sympy"]
split-on-trailing-comma = false

[tool.ruff.lint.pep8-naming]
ignore-names = [
    "*_I",
    "*_I_*",
    "A",
    "Dx",
    "I0",
    "I_*",
    "L",
    "P[xyz]",
    "R",
    "S",
    "U_*",
    "[RH]_*",
    "abs_Δα",
    "l_*",
    "mK",
    "mKπ",
    "max_L",
    "mΣ",
    "s_A",
    "Γ*",
    "λ*",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "C90",
    "D",
    "N8",
    "PLR09",
    "T20",
    "TC00",
    "ambiguous-variable-name",
    "assert",
    "exec-builtin",
    "float-equality-comparison",
    "global-statement",
    "global-variable-not-assigned",
    "import-private-name",
    "mixed-case-variable-in-global-scope",
    "module-import-not-at-top-of-file",
    "non-lowercase-variable-in-function",
    "suspicious-eval-usage",
    "suspicious-pickle-usage",
    "suspicious-url-open-usage",
    "too-many-blank-lines",
    "unnecessary-collection-call",
    "useless-expression",
    "useless-semicolon",
]
"**/benchmark.ipynb" = ["undefined-name"]
"**/polarimetry.ipynb" = ["private-member-access"]
"**/uncertainties.ipynb" = ["unused-function-argument"]
"**/widget.ipynb" = ["unused-function-argument"]
"docs/*" = [
    "assert",
    "implicit-namespace-package",
    "module-import-not-at-top-of-file",
    "request-without-timeout",
    "suspicious-url-open-usage",
]
"docs/conf.py" = [
    "builtin-variable-shadowing",
    "call-datetime-now-without-tzinfo",
    "print",
    "subprocess-popen-with-shell-equals-true",
    "suspicious-subprocess-import",
    "undocumented-public-module",
]
"src/polarimetry/io.py" = ["suspicious-pickle-usage"]  # pickle
"src/polarimetry/plot.py" = [
    "suspicious-subprocess-import",
    "S60",
]
"tests/*" = [
    "D",
    "T20",
    "assert",
    "boolean-type-hint-positional-argument",
    "float-equality-comparison",
    "implicit-namespace-package",
    "import-private-name",
    "no-self-use",
    "non-lowercase-variable-in-function",
    "private-member-access",
    "unnecessary-collection-call",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools]
include-package-data = false
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"polarimetry.lhcb" = [
    "model-definitions.yaml",
    "particle-definitions.yaml",
]

[tool.setuptools.packages.find]
namespaces = false
where = ["src"]

[tool.setuptools_scm]
version_file = "src/polarimetry/version.py"

[tool.tombi.files]
exclude = [
    "**/Manifest.toml",
    "**/Project.toml",
    "**/uv.lock",
]

[tool.tombi.format.rules]
indent-width = 4
line-width = 88

[tool.tombi.lint.rules]
key-empty = "off"

[[tool.tombi.schemas]]
root = "tool.compwa.policy"
path = "https://raw.githubusercontent.com/ComPWA/policy/0.10.5/compwa-policy.schema.json"
include = ["pyproject.toml"]

[[tool.ty.overrides]]
include = ["docs/amplitude-model.ipynb"]
rules.invalid-argument-type = "ignore"
rules.missing-attribute = "ignore"
rules.unsupported-operator = "ignore"

[[tool.ty.overrides]]
include = ["docs/appendix/alignment.ipynb"]
rules.possibly-unresolved-reference = "ignore"

[[tool.ty.overrides]]
include = ["docs/appendix/benchmark.ipynb"]
rules.invalid-argument-type = "ignore"
rules.unresolved-reference = "ignore"

[[tool.ty.overrides]]
include = ["docs/cross-check.ipynb"]
rules.call-non-callable = "ignore"
rules.invalid-argument-type = "ignore"
rules.missing-attribute = "ignore"
rules.possibly-missing-attribute = "ignore"

[[tool.ty.overrides]]
include = ["docs/appendix/dynamics.ipynb"]
rules.invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["docs/appendix/ls-model.ipynb"]
rules.invalid-argument-type = "ignore"
rules.missing-attribute = "ignore"

[[tool.ty.overrides]]
include = ["docs/appendix/model-serialization.ipynb"]
rules.invalid-argument-type = "ignore"
rules.missing-attribute = "ignore"
rules.unresolved-reference = "ignore"

[[tool.ty.overrides]]
include = ["docs/appendix/pc-pv-currents.ipynb"]
rules.invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["docs/appendix/serialization.ipynb"]
rules.invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["docs/index.ipynb"]
rules.missing-attribute = "ignore"

[[tool.ty.overrides]]
include = ["docs/appendix/widget.ipynb"]
rules.missing-attribute = "ignore"
rules.no-matching-overload = "ignore"
rules.possibly-unresolved-reference = "ignore"

[[tool.ty.overrides]]
include = ["docs/intensity.ipynb"]
rules.missing-attribute = "ignore"

[[tool.ty.overrides]]
include = ["docs/uncertainties.ipynb"]
rules.invalid-argument-type = "ignore"
rules.invalid-return-type = "ignore"
rules.missing-attribute = "ignore"
rules.possibly-unresolved-reference = "ignore"
rules.unsupported-operator = "ignore"

[[tool.ty.overrides]]
include = ["docs/resonance-polarimetry.ipynb"]
rules.invalid-return-type = "ignore"

[[tool.ty.overrides]]
include = ["docs/zz.polarization-fit.ipynb"]
rules.invalid-argument-type = "ignore"
rules.invalid-assignment = "ignore"
rules.invalid-return-type = "ignore"

[tool.ty.rules]
division-by-zero = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"

[tool.ty.terminal]
error-on-warning = true
