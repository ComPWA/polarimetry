name: Update

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - main
      - epic/*
  workflow_dispatch:

jobs:
  lock:
    uses: ComPWA/actions/.github/workflows/lock.yml@d042c483a3a7fd3203810bbd4f778fe6ce16df02 # shared-autofix
    secrets:
      token: ${{ secrets.PAT }}
